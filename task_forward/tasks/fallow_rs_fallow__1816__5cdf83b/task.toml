schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/fallow_rs_fallow__1816__5cdf83b"
description = "Predict which CI workflows the fix for fallow-rs/fallow#1816 activates"
keywords    = ["swe-time", "forward", "ci-routing", "fallow-rs/fallow"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "fallow_rs_fallow__1816__5cdf83b"
repo      = "fallow-rs/fallow"
issue_id  = "1816"
base_sha  = "5cdf83b10de669b72f559142ecdd36f54c7bc4a5"
temporal  = "T_high"
spatial   = "S_high"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "main"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The fixing
# pull request is public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
