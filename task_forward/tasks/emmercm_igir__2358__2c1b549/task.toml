schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/emmercm_igir__2358__2c1b549"
description = "Predict which CI workflows the fix for emmercm/igir#2358 activates"
keywords    = ["swe-time", "forward", "ci-routing", "emmercm/igir"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "emmercm_igir__2358__2c1b549"
repo      = "emmercm/igir"
issue_id  = "2358"
base_sha  = "2c1b5499ef630df1a66171ae0f9e7f8301480634"
temporal  = "T_high"
spatial   = "S_high"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "main"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The fixing
# pull request is public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
