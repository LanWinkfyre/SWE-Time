schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/mudler_LocalAI__9683__4e154b5"
description = "Predict which CI workflows the fix for mudler/LocalAI#9683 activates"
keywords    = ["swe-time", "forward", "ci-routing", "mudler/LocalAI"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "mudler_LocalAI__9683__4e154b5"
repo      = "mudler/LocalAI"
issue_id  = "9683"
base_sha  = "4e154b59e54f028cf44f8bad88b6bca352e41b7f"
temporal  = "T_high"
spatial   = "S_low"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "master"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The fixing
# pull request is public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
