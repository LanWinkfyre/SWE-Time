schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/NVIDIA_NemoClaw__11650__74f14bf"
description = "Predict which CI workflows the fix for NVIDIA/NemoClaw#11650 activates"
keywords    = ["swe-time", "forward", "ci-routing", "NVIDIA/NemoClaw"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "NVIDIA_NemoClaw__11650__74f14bf"
repo      = "NVIDIA/NemoClaw"
issue_id  = "11650"
base_sha  = "74f14bf2179aba35e3db4adcb7e9626db522b1ef"
temporal  = "T_low"
spatial   = "S_low"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "main"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The fixing
# pull request is public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
