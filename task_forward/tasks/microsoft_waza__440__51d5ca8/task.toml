schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/microsoft_waza__440__51d5ca8"
description = "Predict which CI workflows the fix for microsoft/waza#440 activates"
keywords    = ["swe-time", "forward", "ci-routing", "microsoft/waza"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "microsoft_waza__440__51d5ca8"
repo      = "microsoft/waza"
issue_id  = "440"
base_sha  = "51d5ca8aba9738bdb7bca85c623251e40e109d75"
temporal  = "T_high"
spatial   = "S_high"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "main"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
