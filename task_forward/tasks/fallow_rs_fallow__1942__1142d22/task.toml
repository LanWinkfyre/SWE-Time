schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/fallow_rs_fallow__1942__1142d22"
description = "Predict which CI workflows the fix for fallow-rs/fallow#1942 activates"
keywords    = ["swe-time", "forward", "ci-routing", "fallow-rs/fallow"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "fallow_rs_fallow__1942__1142d22"
repo      = "fallow-rs/fallow"
issue_id  = "1942"
base_sha  = "1142d229914e21b25dba587d48983ecd6fb06fd4"
temporal  = "T_high"
spatial   = "S_low"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "main"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The fixing
# pull request is public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
