schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/giampaolo_psutil__2576__163b4d5"
description = "Predict which CI workflows the fix for giampaolo/psutil#2576 activates"
keywords    = ["swe-time", "forward", "ci-routing", "giampaolo/psutil"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "giampaolo_psutil__2576__163b4d5"
repo      = "giampaolo/psutil"
issue_id  = "2576"
base_sha  = "163b4d5577281c4575c7fe7dc6d4fca542b37c7f"
temporal  = "T_high"
spatial   = "S_high"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "master"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The fixing
# pull request is public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
