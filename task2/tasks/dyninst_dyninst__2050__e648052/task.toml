schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/dyninst_dyninst__2050__e648052"
description = "Predict which CI workflows the fix for dyninst/dyninst#2050 activates"
keywords    = ["swe-time", "forward", "ci-routing", "dyninst/dyninst"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "dyninst_dyninst__2050__e648052"
repo      = "dyninst/dyninst"
issue_id  = "2050"
base_sha  = "e6480522b30638faf324332f209d246adf9046cf"
temporal  = "T_high"
spatial   = "S_low"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "master"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The fixing
# pull request is public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
