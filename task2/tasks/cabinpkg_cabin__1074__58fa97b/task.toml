schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/cabinpkg_cabin__1074__58fa97b"
description = "Predict which CI workflows the fix for cabinpkg/cabin#1074 activates"
keywords    = ["swe-time", "forward", "ci-routing", "cabinpkg/cabin"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "cabinpkg_cabin__1074__58fa97b"
repo      = "cabinpkg/cabin"
issue_id  = "1074"
base_sha  = "58fa97b4e3dbf568426646840ed056ff34bdad4a"
temporal  = "T_low"
spatial   = "S_high"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "main"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The fixing
# pull request is public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
