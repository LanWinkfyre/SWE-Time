schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/fluent_fluent_bit__12202__6315162"
description = "Predict which CI workflows the fix for fluent/fluent-bit#12202 activates"
keywords    = ["swe-time", "forward", "ci-routing", "fluent/fluent-bit"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "fluent_fluent_bit__12202__6315162"
repo      = "fluent/fluent-bit"
issue_id  = "12202"
base_sha  = "6315162a8d4b1ef42b038834e639697f8cb44912"
temporal  = "T_high"
spatial   = "S_low"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "master"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The fixing
# pull request is public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
