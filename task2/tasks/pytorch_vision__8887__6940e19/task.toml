schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/pytorch_vision__8887__6940e19"
description = "Predict which CI workflows the fix for pytorch/vision#8887 activates"
keywords    = ["swe-time", "forward", "ci-routing", "pytorch/vision"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "pytorch_vision__8887__6940e19"
repo      = "pytorch/vision"
issue_id  = "8887"
base_sha  = "6940e19087cecb5108370703e207f7a33d9b478d"
temporal  = "T_low"
spatial   = "S_high"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "main"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The fixing
# pull request is public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
