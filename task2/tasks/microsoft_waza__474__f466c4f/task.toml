schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/microsoft_waza__474__f466c4f"
description = "Predict which CI workflows the fix for microsoft/waza#474 activates"
keywords    = ["swe-time", "forward", "ci-routing", "microsoft/waza"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "microsoft_waza__474__f466c4f"
repo      = "microsoft/waza"
issue_id  = "474"
base_sha  = "f466c4fddf71144f42311d7c4157e8c8b3f0fed6"
temporal  = "T_low"
spatial   = "S_high"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "main"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The fixing
# pull request is public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
