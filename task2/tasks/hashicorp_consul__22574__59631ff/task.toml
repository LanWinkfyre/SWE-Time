schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-forward/hashicorp_consul__22574__59631ff"
description = "Predict which CI workflows the fix for hashicorp/consul#22574 activates"
keywords    = ["swe-time", "forward", "ci-routing", "hashicorp/consul"]

[metadata]
benchmark = "swe-time-forward"
case_id   = "hashicorp_consul__22574__59631ff"
repo      = "hashicorp/consul"
issue_id  = "22574"
base_sha  = "59631ffd3671935a5c451e583333e07d99b791ae"
temporal  = "T_high"
spatial   = "S_low"

[metadata.event_context]
activity                  = "pull_request_update"
action                    = "synchronize"
base_ref                  = "main"
draft                     = false
activation_scope          = "direct"
eligible_trigger_families = ["pull_request", "pull_request_target"]

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 8192
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The fixing
# pull request is public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
