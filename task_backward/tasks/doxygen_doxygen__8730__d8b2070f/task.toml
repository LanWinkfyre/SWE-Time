schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/doxygen_doxygen__8730__d8b2070f"
description = "Find the commit that introduced the regression reported in doxygen/doxygen#8730"
keywords    = ["swe-time", "backward", "regression-localization", "doxygen/doxygen"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "doxygen_doxygen__8730__d8b2070f"
repo       = "doxygen/doxygen"
issue_id   = "8730"
cutoff_sha = "0d28550e0d4f51b7f6296818d72d5c30543874ba"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
