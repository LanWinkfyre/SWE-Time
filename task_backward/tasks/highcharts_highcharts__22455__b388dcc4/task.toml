schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/highcharts_highcharts__22455__b388dcc4"
description = "Find the commit that introduced the regression reported in highcharts/highcharts#22455"
keywords    = ["swe-time", "backward", "regression-localization", "highcharts/highcharts"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "highcharts_highcharts__22455__b388dcc4"
repo       = "highcharts/highcharts"
issue_id   = "22455"
cutoff_sha = "7d12b6296615ffdc7cc976b54db5c23038b37d01"
locality   = "Cross"
boundary   = "High"
