schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/julialang_julia__52363__4b3898a1"
description = "Find the commit that introduced the regression reported in JuliaLang/julia#52363"
keywords    = ["swe-time", "backward", "regression-localization", "JuliaLang/julia"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "julialang_julia__52363__4b3898a1"
repo       = "JuliaLang/julia"
issue_id   = "52363"
cutoff_sha = "aef528d32a6291ce82452c3a1ff1fa56ccf17641"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
