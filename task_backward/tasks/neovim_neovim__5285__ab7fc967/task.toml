schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/neovim_neovim__5285__ab7fc967"
description = "Find the commit that introduced the regression reported in neovim/neovim#5285"
keywords    = ["swe-time", "backward", "regression-localization", "neovim/neovim"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "neovim_neovim__5285__ab7fc967"
repo       = "neovim/neovim"
issue_id   = "5285"
cutoff_sha = "f175b281cf3e6d5287663b79c4a7f705eb83301a"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
