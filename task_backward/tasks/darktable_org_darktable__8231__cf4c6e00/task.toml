schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/darktable_org_darktable__8231__cf4c6e00"
description = "Find the commit that introduced the regression reported in darktable-org/darktable#8231"
keywords    = ["swe-time", "backward", "regression-localization", "darktable-org/darktable"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "darktable_org_darktable__8231__cf4c6e00"
repo       = "darktable-org/darktable"
issue_id   = "8231"
cutoff_sha = "b6b4928c568bd1284d09833e5d0c3e695a958c5b"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
