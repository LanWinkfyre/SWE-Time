schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/clickhouse_clickhouse__39996__361869d3"
description = "Find the commit that introduced the regression reported in ClickHouse/ClickHouse#39996"
keywords    = ["swe-time", "backward", "regression-localization", "ClickHouse/ClickHouse"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "clickhouse_clickhouse__39996__361869d3"
repo       = "ClickHouse/ClickHouse"
