schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/curl_curl__10514__faaa3d23"
description = "Find the commit that introduced the regression reported in curl/curl#10514"
keywords    = ["swe-time", "backward", "regression-localization", "curl/curl"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "curl_curl__10514__faaa3d23"
repo       = "curl/curl"
issue_id   = "10514"
cutoff_sha = "964ff76863b63516fce94d547adbbbb7d0d5c7b2"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
