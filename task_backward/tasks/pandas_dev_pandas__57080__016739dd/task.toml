schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/pandas_dev_pandas__57080__016739dd"
description = "Find the commit that introduced the regression reported in pandas-dev/pandas#57080"
keywords    = ["swe-time", "backward", "regression-localization", "pandas-dev/pandas"]

[metadata]
benchmark  = "swe-time-backward"
