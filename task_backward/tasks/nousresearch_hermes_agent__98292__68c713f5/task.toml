schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/nousresearch_hermes_agent__98292__68c713f5"
description = "Find the commit that introduced the regression reported in NousResearch/hermes-agent#98292"
keywords    = ["swe-time", "backward", "regression-localization", "NousResearch/hermes-agent"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "nousresearch_hermes_agent__98292__68c713f5"
repo       = "NousResearch/hermes-agent"
issue_id   = "98292"
cutoff_sha = "89b38ed734ab2d5c3d263bc24fbdb8c74e931af4"
locality   = "Local"
boundary   = "High"
