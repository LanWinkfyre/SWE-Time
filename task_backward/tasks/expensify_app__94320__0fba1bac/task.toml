schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/expensify_app__94320__0fba1bac"
description = "Find the commit that introduced the regression reported in Expensify/App#94320"
keywords    = ["swe-time", "backward", "regression-localization", "Expensify/App"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "expensify_app__94320__0fba1bac"
repo       = "Expensify/App"
issue_id   = "94320"
cutoff_sha = "1d88d349ddaa8ff17d0c1e5e16e9adb9c0a2e3a1"
locality   = "Cross"
boundary   = "Low"
subset     = "S2"

[verifier]
timeout_sec  = 900.0
