schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/julialang_julia__48236__0e1b4efc"
description = "Find the commit that introduced the regression reported in JuliaLang/julia#48236"
keywords    = ["swe-time", "backward", "regression-localization", "JuliaLang/julia"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "julialang_julia__48236__0e1b4efc"
repo       = "JuliaLang/julia"
issue_id   = "48236"
cutoff_sha = "a526a4a4b3e9afc648320291c6242d99b364667f"
locality   = "Local"
boundary   = "Low"
