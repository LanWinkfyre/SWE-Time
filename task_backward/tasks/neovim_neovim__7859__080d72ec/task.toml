schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/neovim_neovim__7859__080d72ec"
description = "Find the commit that introduced the regression reported in neovim/neovim#7859"
keywords    = ["swe-time", "backward", "regression-localization", "neovim/neovim"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "neovim_neovim__7859__080d72ec"
repo       = "neovim/neovim"
issue_id   = "7859"
cutoff_sha = "c06995b34d604a37f80ee1174fcb3530dbd59206"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
