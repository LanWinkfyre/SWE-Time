schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/bazelbuild_bazel__20276__27127128"
description = "Find the commit that introduced the regression reported in bazelbuild/bazel#20276"
keywords    = ["swe-time", "backward", "regression-localization", "bazelbuild/bazel"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "bazelbuild_bazel__20276__27127128"
repo       = "bazelbuild/bazel"
issue_id   = "20276"
cutoff_sha = "08407743e903627d7e64c669f27b3f2b81316e33"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
