schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/apache_lucene__14546__6caf325a"
description = "Find the commit that introduced the regression reported in apache/lucene#14546"
keywords    = ["swe-time", "backward", "regression-localization", "apache/lucene"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "apache_lucene__14546__6caf325a"
repo       = "apache/lucene"
issue_id   = "14546"
cutoff_sha = "d76d55b6396d84ef7bd7c4ab2e29eab6ef497323"
locality   = "Cross"
boundary   = "Low"
