schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/systemd_systemd__3927__2b3513f6"
description = "Find the commit that introduced the regression reported in systemd/systemd#3927"
keywords    = ["swe-time", "backward", "regression-localization", "systemd/systemd"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "systemd_systemd__3927__2b3513f6"
repo       = "systemd/systemd"
issue_id   = "3927"
cutoff_sha = "3f193af8807be50913b87e1a5b88c494f8985667"
locality   = "Local"
boundary   = "High"
