schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/openra_openra__17438__950284fe"
description = "Find the commit that introduced the regression reported in OpenRA/OpenRA#17438"
keywords    = ["swe-time", "backward", "regression-localization", "OpenRA/OpenRA"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "openra_openra__17438__950284fe"
repo       = "OpenRA/OpenRA"
issue_id   = "17438"
cutoff_sha = "22374ed73263cdaea71f4576476caa147b02dffe"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
