schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/prometheus_prometheus__12129__9938e810"
description = "Find the commit that introduced the regression reported in prometheus/prometheus#12129"
keywords    = ["swe-time", "backward", "regression-localization", "prometheus/prometheus"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "prometheus_prometheus__12129__9938e810"
repo       = "prometheus/prometheus"
issue_id   = "12129"
cutoff_sha = "6c008ec56af958debf4123d7cd58a6681d17303d"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
