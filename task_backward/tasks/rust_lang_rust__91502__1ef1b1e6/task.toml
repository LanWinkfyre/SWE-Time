schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/rust_lang_rust__91502__1ef1b1e6"
description = "Find the commit that introduced the regression reported in rust-lang/rust#91502"
keywords    = ["swe-time", "backward", "regression-localization", "rust-lang/rust"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "rust_lang_rust__91502__1ef1b1e6"
repo       = "rust-lang/rust"
issue_id   = "91502"
cutoff_sha = "532d2b14c05f9bc20b2d27cbb5f4550d28343a36"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
