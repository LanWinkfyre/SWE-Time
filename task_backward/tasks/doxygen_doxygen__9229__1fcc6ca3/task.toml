schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/doxygen_doxygen__9229__1fcc6ca3"
description = "Find the commit that introduced the regression reported in doxygen/doxygen#9229"
keywords    = ["swe-time", "backward", "regression-localization", "doxygen/doxygen"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "doxygen_doxygen__9229__1fcc6ca3"
repo       = "doxygen/doxygen"
issue_id   = "9229"
cutoff_sha = "91095fb62f0bc2c624b0e8e49d9316f51be76559"
