schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/cue_lang_cue__2584__f8eaf04e"
description = "Find the commit that introduced the regression reported in cue-lang/cue#2584"
keywords    = ["swe-time", "backward", "regression-localization", "cue-lang/cue"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "cue_lang_cue__2584__f8eaf04e"
repo       = "cue-lang/cue"
issue_id   = "2584"
cutoff_sha = "a44c805cc6f93e9fb32ef6ea81c2b1442c5b39ad"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
