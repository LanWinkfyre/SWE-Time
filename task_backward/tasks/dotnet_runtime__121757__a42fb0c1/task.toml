schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/dotnet_runtime__121757__a42fb0c1"
description = "Find the commit that introduced the regression reported in dotnet/runtime#121757"
keywords    = ["swe-time", "backward", "regression-localization", "dotnet/runtime"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "dotnet_runtime__121757__a42fb0c1"
repo       = "dotnet/runtime"
issue_id   = "121757"
cutoff_sha = "ea8d8a0339bdf8b736ef5706900bab48429d1cf6"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 7168
