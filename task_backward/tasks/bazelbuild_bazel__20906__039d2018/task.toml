schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/bazelbuild_bazel__20906__039d2018"
description = "Find the commit that introduced the regression reported in bazelbuild/bazel#20906"
keywords    = ["swe-time", "backward", "regression-localization", "bazelbuild/bazel"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "bazelbuild_bazel__20906__039d2018"
repo       = "bazelbuild/bazel"
issue_id   = "20906"
cutoff_sha = "cddec1247571f1cda9939ffb7546e089e528c76e"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
