schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/grafana_grafana__130484__6c9fcfe7"
description = "Find the commit that introduced the regression reported in grafana/grafana#130484"
keywords    = ["swe-time", "backward", "regression-localization", "grafana/grafana"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "grafana_grafana__130484__6c9fcfe7"
repo       = "grafana/grafana"
issue_id   = "130484"
cutoff_sha = "e6cf001c19890a110b4f2677776988793d02f14a"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 6144
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
