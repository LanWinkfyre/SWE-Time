schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/bazelbuild_bazel__25258__1c7671d7"
description = "Find the commit that introduced the regression reported in bazelbuild/bazel#25258"
keywords    = ["swe-time", "backward", "regression-localization", "bazelbuild/bazel"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "bazelbuild_bazel__25258__1c7671d7"
repo       = "bazelbuild/bazel"
issue_id   = "25258"
cutoff_sha = "95bbed03758a7651916d0708a892f5342a0421c5"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
