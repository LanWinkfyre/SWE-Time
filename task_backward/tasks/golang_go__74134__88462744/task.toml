description = "Find the commit that introduced the regression reported in golang/go#74134"
keywords    = ["swe-time", "backward", "regression-localization", "golang/go"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "golang_go__74134__88462744"
repo       = "golang/go"
issue_id   = "74134"
cutoff_sha = "934d5f2cf703c6aad9f0ce6a73a3922d1af83049"
locality   = "Cross"
