schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/rails_rails__3837__0ccc6a8f"
description = "Find the commit that introduced the regression reported in rails/rails#3837"
keywords    = ["swe-time", "backward", "regression-localization", "rails/rails"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "rails_rails__3837__0ccc6a8f"
repo       = "rails/rails"
issue_id   = "3837"
cutoff_sha = "9ac6310bd988f19b02e375f1f9594df4d469f624"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
