schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/expensify_app__75931__23f0c52d"
description = "Find the commit that introduced the regression reported in Expensify/App#75931"
keywords    = ["swe-time", "backward", "regression-localization", "Expensify/App"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "expensify_app__75931__23f0c52d"
repo       = "Expensify/App"
issue_id   = "75931"
cutoff_sha = "3f1a831f7ce5305993f44b3da7571fbd063ce7c5"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 6144
