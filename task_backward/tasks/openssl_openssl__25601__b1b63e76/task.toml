schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/openssl_openssl__25601__b1b63e76"
description = "Find the commit that introduced the regression reported in openssl/openssl#25601"
keywords    = ["swe-time", "backward", "regression-localization", "openssl/openssl"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "openssl_openssl__25601__b1b63e76"
repo       = "openssl/openssl"
issue_id   = "25601"
cutoff_sha = "93d1bb6dff0f0126ef1a5cac7b8693308763eb8a"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
