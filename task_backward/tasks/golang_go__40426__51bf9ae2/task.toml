schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/golang_go__40426__51bf9ae2"
description = "Find the commit that introduced the regression reported in golang/go#40426"
keywords    = ["swe-time", "backward", "regression-localization", "golang/go"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "golang_go__40426__51bf9ae2"
repo       = "golang/go"
issue_id   = "40426"
cutoff_sha = "8696ae82c94f0a7707cbbbdf2cec44e93edf5b23"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
