schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/darktable_org_darktable__9816__51206689"
description = "Find the commit that introduced the regression reported in darktable-org/darktable#9816"
keywords    = ["swe-time", "backward", "regression-localization", "darktable-org/darktable"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "darktable_org_darktable__9816__51206689"
repo       = "darktable-org/darktable"
