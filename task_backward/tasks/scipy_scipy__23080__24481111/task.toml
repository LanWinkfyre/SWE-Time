description = "Find the commit that introduced the regression reported in scipy/scipy#23080"
keywords    = ["swe-time", "backward", "regression-localization", "scipy/scipy"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "scipy_scipy__23080__24481111"
