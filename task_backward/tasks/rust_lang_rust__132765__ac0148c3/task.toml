schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/rust_lang_rust__132765__ac0148c3"
description = "Find the commit that introduced the regression reported in rust-lang/rust#132765"
keywords    = ["swe-time", "backward", "regression-localization", "rust-lang/rust"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "rust_lang_rust__132765__ac0148c3"
repo       = "rust-lang/rust"
issue_id   = "132765"
cutoff_sha = "6295686a37ed731f1059b07157170c9ac56bf8c3"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
