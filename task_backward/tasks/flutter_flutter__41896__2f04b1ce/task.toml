schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/flutter_flutter__41896__2f04b1ce"
description = "Find the commit that introduced the regression reported in flutter/flutter#41896"
keywords    = ["swe-time", "backward", "regression-localization", "flutter/flutter"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "flutter_flutter__41896__2f04b1ce"
repo       = "flutter/flutter"
issue_id   = "41896"
cutoff_sha = "fa7340a328cbfbe745748cfcd5d5fe08c401c64c"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
