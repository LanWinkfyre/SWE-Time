schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/prometheus_prometheus__5321__27bb4757"
description = "Find the commit that introduced the regression reported in prometheus/prometheus#5321"
keywords    = ["swe-time", "backward", "regression-localization", "prometheus/prometheus"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "prometheus_prometheus__5321__27bb4757"
repo       = "prometheus/prometheus"
issue_id   = "5321"
cutoff_sha = "d390497280d61918aa8792f87a2f458e5e231ec2"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
