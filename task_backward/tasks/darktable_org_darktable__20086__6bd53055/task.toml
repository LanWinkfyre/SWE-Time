schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/darktable_org_darktable__20086__6bd53055"
description = "Find the commit that introduced the regression reported in darktable-org/darktable#20086"
keywords    = ["swe-time", "backward", "regression-localization", "darktable-org/darktable"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "darktable_org_darktable__20086__6bd53055"
repo       = "darktable-org/darktable"
issue_id   = "20086"
cutoff_sha = "65fe2e9e3ae0726fb6756e185df27b0b46b12e61"
locality   = "Local"
