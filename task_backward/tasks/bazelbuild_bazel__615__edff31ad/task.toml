schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/bazelbuild_bazel__615__edff31ad"
description = "Find the commit that introduced the regression reported in bazelbuild/bazel#615"
keywords    = ["swe-time", "backward", "regression-localization", "bazelbuild/bazel"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "bazelbuild_bazel__615__edff31ad"
repo       = "bazelbuild/bazel"
issue_id   = "615"
cutoff_sha = "50bf666652aacd274d534ad4ec4eadf8e8452e05"
locality   = "Cross"
boundary   = "Low"
subset     = "S2"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
