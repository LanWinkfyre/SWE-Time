schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/ray_project_ray__19200__2faf8302"
description = "Find the commit that introduced the regression reported in ray-project/ray#19200"
keywords    = ["swe-time", "backward", "regression-localization", "ray-project/ray"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "ray_project_ray__19200__2faf8302"
repo       = "ray-project/ray"
issue_id   = "19200"
cutoff_sha = "fd438d5630556a3727e7699ee3a86de5f8ffa929"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
