schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/bazelbuild_bazel__20494__a879081c"
description = "Find the commit that introduced the regression reported in bazelbuild/bazel#20494"
keywords    = ["swe-time", "backward", "regression-localization", "bazelbuild/bazel"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "bazelbuild_bazel__20494__a879081c"
repo       = "bazelbuild/bazel"
