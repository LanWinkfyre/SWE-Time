schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/openssl_openssl__11763__5de4f94a"
description = "Find the commit that introduced the regression reported in openssl/openssl#11763"
keywords    = ["swe-time", "backward", "regression-localization", "openssl/openssl"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "openssl_openssl__11763__5de4f94a"
repo       = "openssl/openssl"
issue_id   = "11763"
cutoff_sha = "73d6b4efe6835a6c97ce61df6bf339b0903e5b7a"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
