schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/ansible_ansible__6539__95680088"
description = "Find the commit that introduced the regression reported in ansible/ansible#6539"
keywords    = ["swe-time", "backward", "regression-localization", "ansible/ansible"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "ansible_ansible__6539__95680088"
repo       = "ansible/ansible"
issue_id   = "6539"
cutoff_sha = "9da26da335924f1fe4dd8fae94780dbfccbe4269"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
