schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/flutter_flutter__137929__467494f2"
description = "Find the commit that introduced the regression reported in flutter/flutter#137929"
keywords    = ["swe-time", "backward", "regression-localization", "flutter/flutter"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "flutter_flutter__137929__467494f2"
repo       = "flutter/flutter"
issue_id   = "137929"
cutoff_sha = "12de94d152ad14c0cdf2aa615f5050fdd6be3329"
