schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/highcharts_highcharts__17975__3d1a4d57"
description = "Find the commit that introduced the regression reported in highcharts/highcharts#17975"
keywords    = ["swe-time", "backward", "regression-localization", "highcharts/highcharts"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "highcharts_highcharts__17975__3d1a4d57"
repo       = "highcharts/highcharts"
issue_id   = "17975"
cutoff_sha = "c4780cb830d3180b5eb67899c42461397c0c9179"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
