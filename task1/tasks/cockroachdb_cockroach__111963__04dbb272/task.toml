schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/cockroachdb_cockroach__111963__04dbb272"
description = "Find the commit that introduced the regression reported in cockroachdb/cockroach#111963"
keywords    = ["swe-time", "backward", "regression-localization", "cockroachdb/cockroach"]

[metadata]
benchmark  = "swe-time-backward"
