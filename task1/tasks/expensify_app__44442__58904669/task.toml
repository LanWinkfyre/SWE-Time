schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/expensify_app__44442__58904669"
description = "Find the commit that introduced the regression reported in Expensify/App#44442"
keywords    = ["swe-time", "backward", "regression-localization", "Expensify/App"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "expensify_app__44442__58904669"
repo       = "Expensify/App"
issue_id   = "44442"
cutoff_sha = "0c20881a308244867119efa6196481b65bb81274"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
