schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/golang_go__64282__b7d95403"
description = "Find the commit that introduced the regression reported in golang/go#64282"
keywords    = ["swe-time", "backward", "regression-localization", "golang/go"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "golang_go__64282__b7d95403"
repo       = "golang/go"
issue_id   = "64282"
cutoff_sha = "468bc941886ae83b8d16af5deaaf12ea5cabb05b"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
