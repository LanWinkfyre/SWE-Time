schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/ansible_ansible__61621__4a7525e3"
description = "Find the commit that introduced the regression reported in ansible/ansible#61621"
keywords    = ["swe-time", "backward", "regression-localization", "ansible/ansible"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "ansible_ansible__61621__4a7525e3"
repo       = "ansible/ansible"
issue_id   = "61621"
cutoff_sha = "0e1ec04efb10590a99bf7d6f30b2af6731a8239e"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
