schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/flutter_flutter__96324__7a096f10"
description = "Find the commit that introduced the regression reported in flutter/flutter#96324"
keywords    = ["swe-time", "backward", "regression-localization", "flutter/flutter"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "flutter_flutter__96324__7a096f10"
repo       = "flutter/flutter"
issue_id   = "96324"
cutoff_sha = "4f02152cec641e91d37f23f50c2e52cc4108f57b"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
