schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/expensify_app__57807__15b345da"
description = "Find the commit that introduced the regression reported in Expensify/App#57807"
keywords    = ["swe-time", "backward", "regression-localization", "Expensify/App"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "expensify_app__57807__15b345da"
repo       = "Expensify/App"
issue_id   = "57807"
cutoff_sha = "da2fa62658cb833cfc13fc75949aa62d11fb4338"
locality   = "Cross"
boundary   = "Low"
subset     = "S2"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
