schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/rails_rails__23625__c5aee4c6"
description = "Find the commit that introduced the regression reported in rails/rails#23625"
keywords    = ["swe-time", "backward", "regression-localization", "rails/rails"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "rails_rails__23625__c5aee4c6"
repo       = "rails/rails"
issue_id   = "23625"
cutoff_sha = "737b718ea0c88d3f6c139343f957f386e06fffc9"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
