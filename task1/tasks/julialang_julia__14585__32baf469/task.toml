schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/julialang_julia__14585__32baf469"
description = "Find the commit that introduced the regression reported in JuliaLang/julia#14585"
keywords    = ["swe-time", "backward", "regression-localization", "JuliaLang/julia"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "julialang_julia__14585__32baf469"
repo       = "JuliaLang/julia"
issue_id   = "14585"
cutoff_sha = "bc1c18ec2f3452de4b5cb714191478e02bb3847a"
locality   = "Cross"
boundary   = "Low"
subset     = "S2"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
