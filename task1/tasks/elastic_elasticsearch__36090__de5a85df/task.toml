schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/elastic_elasticsearch__36090__de5a85df"
description = "Find the commit that introduced the regression reported in elastic/elasticsearch#36090"
keywords    = ["swe-time", "backward", "regression-localization", "elastic/elasticsearch"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "elastic_elasticsearch__36090__de5a85df"
repo       = "elastic/elasticsearch"
issue_id   = "36090"
cutoff_sha = "78e07d467c87e4728734b0da1ebc50f43109175e"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
