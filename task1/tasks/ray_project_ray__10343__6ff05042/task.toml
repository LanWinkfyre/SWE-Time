schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/ray_project_ray__10343__6ff05042"
description = "Find the commit that introduced the regression reported in ray-project/ray#10343"
keywords    = ["swe-time", "backward", "regression-localization", "ray-project/ray"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "ray_project_ray__10343__6ff05042"
repo       = "ray-project/ray"
issue_id   = "10343"
cutoff_sha = "4b856fa41614f5e4ff819ec83e251c9aefd5faef"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
