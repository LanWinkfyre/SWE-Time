schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/rust_lang_rust__126887__5432794c"
description = "Find the commit that introduced the regression reported in rust-lang/rust#126887"
keywords    = ["swe-time", "backward", "regression-localization", "rust-lang/rust"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "rust_lang_rust__126887__5432794c"
repo       = "rust-lang/rust"
issue_id   = "126887"
cutoff_sha = "d49994b060684af423339b55769439b2f444a7b9"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
