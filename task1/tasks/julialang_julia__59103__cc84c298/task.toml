schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/julialang_julia__59103__cc84c298"
description = "Find the commit that introduced the regression reported in JuliaLang/julia#59103"
keywords    = ["swe-time", "backward", "regression-localization", "JuliaLang/julia"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "julialang_julia__59103__cc84c298"
repo       = "JuliaLang/julia"
issue_id   = "59103"
cutoff_sha = "c5ba4e28f2c9c49be01ed7409efedef8627fe96d"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
