schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/rails_rails__14495__2460e431"
description = "Find the commit that introduced the regression reported in rails/rails#14495"
keywords    = ["swe-time", "backward", "regression-localization", "rails/rails"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "rails_rails__14495__2460e431"
repo       = "rails/rails"
issue_id   = "14495"
cutoff_sha = "30b94a876f32f5024f841a6de9b5b20a014a41d3"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
