schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/perryts_perry__8495__31ae75fe"
description = "Find the commit that introduced the regression reported in PerryTS/perry#8495"
keywords    = ["swe-time", "backward", "regression-localization", "PerryTS/perry"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "perryts_perry__8495__31ae75fe"
repo       = "PerryTS/perry"
issue_id   = "8495"
cutoff_sha = "caba324b710d878a60b6f20d5926536f7cad6756"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
