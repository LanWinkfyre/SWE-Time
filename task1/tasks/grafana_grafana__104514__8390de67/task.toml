schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/grafana_grafana__104514__8390de67"
description = "Find the commit that introduced the regression reported in grafana/grafana#104514"
keywords    = ["swe-time", "backward", "regression-localization", "grafana/grafana"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "grafana_grafana__104514__8390de67"
repo       = "grafana/grafana"
