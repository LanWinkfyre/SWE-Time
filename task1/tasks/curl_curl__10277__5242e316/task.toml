schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/curl_curl__10277__5242e316"
description = "Find the commit that introduced the regression reported in curl/curl#10277"
keywords    = ["swe-time", "backward", "regression-localization", "curl/curl"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "curl_curl__10277__5242e316"
repo       = "curl/curl"
issue_id   = "10277"
cutoff_sha = "5cf5bfcd134c1378af6dbae723abf88e309117df"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
