schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/kubernetes_kubernetes__16673__06d253c9"
description = "Find the commit that introduced the regression reported in kubernetes/kubernetes#16673"
keywords    = ["swe-time", "backward", "regression-localization", "kubernetes/kubernetes"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "kubernetes_kubernetes__16673__06d253c9"
repo       = "kubernetes/kubernetes"
issue_id   = "16673"
cutoff_sha = "fd03c2c1d742bba8701fe3e15338ac6302dbb351"
locality   = "Cross"
boundary   = "Low"
subset     = "S2"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
