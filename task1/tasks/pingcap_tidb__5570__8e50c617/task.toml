schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/pingcap_tidb__5570__8e50c617"
description = "Find the commit that introduced the regression reported in pingcap/tidb#5570"
keywords    = ["swe-time", "backward", "regression-localization", "pingcap/tidb"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "pingcap_tidb__5570__8e50c617"
repo       = "pingcap/tidb"
issue_id   = "5570"
cutoff_sha = "ecbd60c3fffd76ed46613da0be89ead4bda7e06c"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
