schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/highcharts_highcharts__1460__45b3b119"
description = "Find the commit that introduced the regression reported in highcharts/highcharts#1460"
keywords    = ["swe-time", "backward", "regression-localization", "highcharts/highcharts"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "highcharts_highcharts__1460__45b3b119"
repo       = "highcharts/highcharts"
issue_id   = "1460"
cutoff_sha = "51620ae161b3bd25b00088b85ec5e74062f831d8"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
