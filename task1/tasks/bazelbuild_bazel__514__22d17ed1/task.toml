schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/bazelbuild_bazel__514__22d17ed1"
description = "Find the commit that introduced the regression reported in bazelbuild/bazel#514"
keywords    = ["swe-time", "backward", "regression-localization", "bazelbuild/bazel"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "bazelbuild_bazel__514__22d17ed1"
repo       = "bazelbuild/bazel"
issue_id   = "514"
cutoff_sha = "97eaf9136abad30827cf1a060cc32e786745923d"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
