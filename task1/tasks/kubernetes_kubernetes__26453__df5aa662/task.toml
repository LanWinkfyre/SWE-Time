schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/kubernetes_kubernetes__26453__df5aa662"
description = "Find the commit that introduced the regression reported in kubernetes/kubernetes#26453"
keywords    = ["swe-time", "backward", "regression-localization", "kubernetes/kubernetes"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "kubernetes_kubernetes__26453__df5aa662"
repo       = "kubernetes/kubernetes"
issue_id   = "26453"
cutoff_sha = "1cca499e9222e8a44cce7b637ac2ff7031c6f290"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
