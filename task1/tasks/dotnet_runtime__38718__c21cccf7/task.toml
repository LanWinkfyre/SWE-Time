schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/dotnet_runtime__38718__c21cccf7"
description = "Find the commit that introduced the regression reported in dotnet/runtime#38718"
keywords    = ["swe-time", "backward", "regression-localization", "dotnet/runtime"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "dotnet_runtime__38718__c21cccf7"
repo       = "dotnet/runtime"
issue_id   = "38718"
cutoff_sha = "106cd9ebaed5f974fa8f17e153ec3e22b6576f43"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 5120
