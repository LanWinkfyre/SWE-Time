schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/bazelbuild_bazel__22692__36299f75"
description = "Find the commit that introduced the regression reported in bazelbuild/bazel#22692"
keywords    = ["swe-time", "backward", "regression-localization", "bazelbuild/bazel"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "bazelbuild_bazel__22692__36299f75"
repo       = "bazelbuild/bazel"
issue_id   = "22692"
cutoff_sha = "4d916c505d932ddd473bccafb84fb97ec97cc69d"
locality   = "Cross"
boundary   = "High"
