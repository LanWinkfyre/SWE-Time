schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/systemd_systemd__7985__ba9e9718"
description = "Find the commit that introduced the regression reported in systemd/systemd#7985"
keywords    = ["swe-time", "backward", "regression-localization", "systemd/systemd"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "systemd_systemd__7985__ba9e9718"
repo       = "systemd/systemd"
issue_id   = "7985"
cutoff_sha = "420d2058674b8f0edb6c135c125df0781b87d964"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
