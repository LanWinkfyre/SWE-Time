schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/doxygen_doxygen__10991__7a1d9227"
description = "Find the commit that introduced the regression reported in doxygen/doxygen#10991"
keywords    = ["swe-time", "backward", "regression-localization", "doxygen/doxygen"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "doxygen_doxygen__10991__7a1d9227"
repo       = "doxygen/doxygen"
issue_id   = "10991"
cutoff_sha = "93ad49251c5f273a7a276e22ef2f8ef48afdd86c"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
