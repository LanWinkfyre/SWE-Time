schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/clickhouse_clickhouse__66888__5fefa54f"
description = "Find the commit that introduced the regression reported in ClickHouse/ClickHouse#66888"
keywords    = ["swe-time", "backward", "regression-localization", "ClickHouse/ClickHouse"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "clickhouse_clickhouse__66888__5fefa54f"
repo       = "ClickHouse/ClickHouse"
issue_id   = "66888"
cutoff_sha = "217363d9a766bacbf0acae88118dff1055dbbaa9"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
