schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/apache_lucene__14975__f81832cb"
description = "Find the commit that introduced the regression reported in apache/lucene#14975"
keywords    = ["swe-time", "backward", "regression-localization", "apache/lucene"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "apache_lucene__14975__f81832cb"
repo       = "apache/lucene"
issue_id   = "14975"
cutoff_sha = "346d7624db510c3bc2cb9012f6a01f29d98ac5de"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
