schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/apache_lucene__14088__81ab6d2b"
description = "Find the commit that introduced the regression reported in apache/lucene#14088"
keywords    = ["swe-time", "backward", "regression-localization", "apache/lucene"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "apache_lucene__14088__81ab6d2b"
repo       = "apache/lucene"
issue_id   = "14088"
cutoff_sha = "c0fc70016e1d79da96aa57d2799d5c9ded8cbb8d"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
