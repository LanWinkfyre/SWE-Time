schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/libretro_retroarch__14830__253b21e9"
description = "Find the commit that introduced the regression reported in libretro/RetroArch#14830"
keywords    = ["swe-time", "backward", "regression-localization", "libretro/RetroArch"]

[metadata]
benchmark  = "swe-time-backward"
