schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/rust_lang_rust__105766__8a2e48e8"
description = "Find the commit that introduced the regression reported in rust-lang/rust#105766"
keywords    = ["swe-time", "backward", "regression-localization", "rust-lang/rust"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "rust_lang_rust__105766__8a2e48e8"
repo       = "rust-lang/rust"
issue_id   = "105766"
cutoff_sha = "7a6af2711baa5a5db116c123116b2150ed63799d"
locality   = "Cross"
boundary   = "Low"
subset     = "S2"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
