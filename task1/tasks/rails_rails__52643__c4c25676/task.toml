schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/rails_rails__52643__c4c25676"
description = "Find the commit that introduced the regression reported in rails/rails#52643"
keywords    = ["swe-time", "backward", "regression-localization", "rails/rails"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "rails_rails__52643__c4c25676"
repo       = "rails/rails"
issue_id   = "52643"
cutoff_sha = "16882b886e245f363cd61f5ea553fe2bc525d070"
locality   = "Local"
boundary   = "Low"
subset     = "S1"

[verifier]
timeout_sec  = 900.0
