schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/cue_lang_cue__4339__a348e498"
description = "Find the commit that introduced the regression reported in cue-lang/cue#4339"
keywords    = ["swe-time", "backward", "regression-localization", "cue-lang/cue"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "cue_lang_cue__4339__a348e498"
repo       = "cue-lang/cue"
issue_id   = "4339"
cutoff_sha = "35cefbf9b4880261ad6dcdecce7c7e44a79a313c"
locality   = "Local"
boundary   = "High"
