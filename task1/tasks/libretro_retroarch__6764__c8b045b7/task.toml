schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/libretro_retroarch__6764__c8b045b7"
description = "Find the commit that introduced the regression reported in libretro/RetroArch#6764"
keywords    = ["swe-time", "backward", "regression-localization", "libretro/RetroArch"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "libretro_retroarch__6764__c8b045b7"
repo       = "libretro/RetroArch"
issue_id   = "6764"
cutoff_sha = "c3c50bae299d72ba44bf577ec79060407e69197d"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
