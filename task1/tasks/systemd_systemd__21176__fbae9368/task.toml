schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/systemd_systemd__21176__fbae9368"
description = "Find the commit that introduced the regression reported in systemd/systemd#21176"
keywords    = ["swe-time", "backward", "regression-localization", "systemd/systemd"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "systemd_systemd__21176__fbae9368"
repo       = "systemd/systemd"
issue_id   = "21176"
cutoff_sha = "ff8b7bd6a0d15311889103c49f752b03d4d830a3"
