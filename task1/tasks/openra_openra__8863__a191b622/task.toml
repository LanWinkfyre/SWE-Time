schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/openra_openra__8863__a191b622"
description = "Find the commit that introduced the regression reported in OpenRA/OpenRA#8863"
keywords    = ["swe-time", "backward", "regression-localization", "OpenRA/OpenRA"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "openra_openra__8863__a191b622"
repo       = "OpenRA/OpenRA"
issue_id   = "8863"
cutoff_sha = "33e779f4c0d75366e41400dc98885afd3dbf6db7"
locality   = "Cross"
boundary   = "High"
subset     = "S4"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
