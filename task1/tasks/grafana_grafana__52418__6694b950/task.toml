schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/grafana_grafana__52418__6694b950"
description = "Find the commit that introduced the regression reported in grafana/grafana#52418"
keywords    = ["swe-time", "backward", "regression-localization", "grafana/grafana"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "grafana_grafana__52418__6694b950"
repo       = "grafana/grafana"
issue_id   = "52418"
cutoff_sha = "824f12a99319b443ac2d837d5c25fffb55816a1a"
locality   = "Cross"
boundary   = "Low"
subset     = "S2"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
