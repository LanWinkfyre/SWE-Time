schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/openssl_openssl__28957__da07b631"
description = "Find the commit that introduced the regression reported in openssl/openssl#28957"
keywords    = ["swe-time", "backward", "regression-localization", "openssl/openssl"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "openssl_openssl__28957__da07b631"
repo       = "openssl/openssl"
issue_id   = "28957"
cutoff_sha = "b2ed1b72fa56e71d53af213e6e5557dcce171a2c"
locality   = "Cross"
boundary   = "Low"
subset     = "S2"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
