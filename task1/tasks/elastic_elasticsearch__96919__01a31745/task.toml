schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/elastic_elasticsearch__96919__01a31745"
description = "Find the commit that introduced the regression reported in elastic/elasticsearch#96919"
keywords    = ["swe-time", "backward", "regression-localization", "elastic/elasticsearch"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "elastic_elasticsearch__96919__01a31745"
repo       = "elastic/elasticsearch"
issue_id   = "96919"
cutoff_sha = "97fd810757fd28ef1eb82776cf4c97ef894e8ad9"
locality   = "Cross"
boundary   = "Low"
subset     = "S2"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
