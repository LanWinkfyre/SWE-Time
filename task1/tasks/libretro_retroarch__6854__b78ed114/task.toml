schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/libretro_retroarch__6854__b78ed114"
description = "Find the commit that introduced the regression reported in libretro/RetroArch#6854"
keywords    = ["swe-time", "backward", "regression-localization", "libretro/RetroArch"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "libretro_retroarch__6854__b78ed114"
repo       = "libretro/RetroArch"
issue_id   = "6854"
cutoff_sha = "861d87281ee075eb811f77ad83d6115c396763e1"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
