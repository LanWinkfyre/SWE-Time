schema_version = "1.2"
artifacts = ["/logs/verifier/detail.json"]

[task]
name        = "swe-time-backward/openssl_openssl__30545__9b5e6d29"
description = "Find the commit that introduced the regression reported in openssl/openssl#30545"
keywords    = ["swe-time", "backward", "regression-localization", "openssl/openssl"]

[metadata]
benchmark  = "swe-time-backward"
case_id    = "openssl_openssl__30545__9b5e6d29"
repo       = "openssl/openssl"
issue_id   = "30545"
cutoff_sha = "d3951537462175218d1e8a553e93fffb7cc1facb"
locality   = "Local"
boundary   = "High"
subset     = "S3"

[verifier]
timeout_sec  = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
workdir           = "/testbed"
cpus              = 4
memory_mb         = 16384
storage_mb        = 4096
# The agent may reach only the hosts passed at run time with --allow-agent-host
# (your model API) and --allow-environment-host (agent install sources).  The answer is
# public on GitHub, so the default must not be open egress.
network_mode      = "allowlist"
allowed_hosts     = []
